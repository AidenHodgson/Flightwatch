name: Check flights

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      report:
        description: "Email everyone their cheapest fares (test run)"
        type: boolean
        default: false

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Flightwatch
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASECAMP_URL: ${{ secrets.BASECAMP_URL }}
          BASECAMP_POST_TOKEN: ${{ secrets.BASECAMP_POST_TOKEN }}
          SAMPLE_EVERY_DAYS: ${{ vars.SAMPLE_EVERY_DAYS || '10' }}
        run: python -m flightwatch.main ${{ inputs.report && '--report' || '' }}
