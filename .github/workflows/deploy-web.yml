name: Deploy settings page

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web
# ADMIN_KEY lives on the Worker itself and survives deploys. Set it once with:
#   cd web && npx wrangler secret put ADMIN_KEY
# or in Cloudflare: Workers & Pages > flightwatch > Settings > Variables and Secrets
